baseURL = 'https://qingstudios.com/'
title = 'Code with ME'
languageCode = 'en-us'
canonifyURLs = true

[[menus.main]]
name = 'Home'
pageRef = '/'
weight = 10

[[menus.main]]
name = 'TAGS'
pageRef = '/tags/'
weight = 20

[[menus.main]]
name = 'ABOUT'
pageRef = '/about/'
weight = 30

[module]
  [module.hugoVersion]
    extended = true
    min = '0.116.0'
  [[module.imports]]
    path = 'github.com/elecbrandy/freshpink'

[params]
  copyright = 'Copyright © 2026 Qing Wei'
  githubUsername = 'qingzistudio'
  googleAnalytics = ''
  mainImageUrl = '/intro/index-bg.jpg'
  math = true
  primaryColor = '#fa8b84'
  showGithubChart = true
  showMainImage = true

  [params.profile]
    avatar = '/avatar/jellyfish.gif'
    name = 'Qing Wei'
    headline = 'Code with ME'
    intro = '这是一个半路出家的码农的博客。现在是个数据工程师，记录代码、建模、数学笔记和一点点可爱的混乱。'
    signature = "Get drunk! Don't be martyred slaves of Time"

    [[params.profile.links]]
      name = 'Website'
      url = 'https://qingstudios.com'

    [[params.profile.links]]
      name = 'GitHub'
      url = 'https://github.com/qingzistudio'

    [[params.profile.links]]
      name = 'Email'
      url = 'mailto:qingwei719@gmail.com'

    [[params.profile.links]]
      name = 'Twitter'
      url = 'https://twitter.com/Amberrwei'

    [[params.profile.links]]
      name = 'Instagram'
      url = 'https://www.instagram.com/qingpiu/'

[taxonomies]
  category = 'categories'
  tag = 'tags'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'
