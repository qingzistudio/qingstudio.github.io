baseURL = 'https://qingstudios.com/'
title = 'Code with ME'
languageCode = 'en-us'
canonifyURLs = true

[[menus.main]]
name = 'Home'
pageRef = '/'
weight = 10

[[menus.main]]
name = 'TAGS'
pageRef = '/tags/'
weight = 20

[[menus.main]]
name = 'ABOUT'
pageRef = '/about/'
weight = 30

[module]
  [module.hugoVersion]
    extended = true
    min = '0.116.0'
  [[module.imports]]
    path = 'github.com/elecbrandy/freshpink'

[params]
  copyright = 'Copyright © 2026 Qing Wei'
  githubUsername = 'qingzistudio'
  googleAnalytics = ''
  mainImageUrl = '/intro/index-bg.jpg'
  math = true
  primaryColor = '#fa8b84'
  showGithubChart = true
  showMainImage = true

[taxonomies]
  tag = 'tags'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'
